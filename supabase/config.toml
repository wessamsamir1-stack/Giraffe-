# =============================================================================
# Giraffe — إعدادات Supabase CLI
#
# الملف ده بيخلي أي حد يستنسخ المشروع يشتغل بنفس الإعدادات بالظبط:
# نفس إصدار Postgres، نفس المخططات المكشوفة، نفس سياسة الدوال.
#
# ملحوظة: الملف ده **مابيغنيش** عن `supabase link --project-ref <ref>`.
# الربط بيتخزن في supabase/.temp/ وده مسار محلي مش بيتحط في Git —
# عشان ماينفعش نحط مشروع سحابي واحد في ريبو ممكن ناس كتير تستخدمه.
# =============================================================================

# اسم المشروع المحلي (بيستخدم كاسم لحاويات Docker وقت `supabase start`).
project_id = "giraffe"

[api]
enabled = true
port = 54321
# المخططات اللي بتتكشف على REST. لاحظ إن `giraffe` مش هنا —
# ده مخطط داخلي للإعدادات والسياق، والمستخدم مالوش دعوة بيه.
schemas = ["public", "graphql_public"]
# extensions لازم يكون في مسار البحث عشان pgcrypto و pg_net يتلقوا.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# لازم يطابق إصدار المشروع السحابي، وإلا الترحيلات هتتفحص على إصدار غلط.
major_version = 16

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# صندوق بريد محلي — كل رسائل التأكيد بتروح هنا وقت التطوير،
# فمفيش أي إيميل حقيقي بيتبعت من الجهاز.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# محلياً بس — على السحابة التأكيد شغّال.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# -----------------------------------------------------------------------------
# دوال الحافة
#
# كلها verify_jwt = true عن قصد:
#
#   - دوال الذكاء الاصطناعي بتنادي requireUser() جوّه كمان (حزام وحمّالة)،
#     لأن التحقق على مستوى البوابة بيقول «فيه رمز صالح» بس، مش «مين ده».
#
#   - send-push مالهاش requireUser لأن اللي بيناديها هو cron بمفتاح الخدمة.
#     وسيبناها true عشان لو اتقفلت البوابة، أي حد على الإنترنت يقدر
#     يستنزف طابور الإشعارات.
# -----------------------------------------------------------------------------
[functions.analyze-item]
verify_jwt = true

[functions.estimate-value]
verify_jwt = true

[functions.moderate-item]
verify_jwt = true

[functions.send-push]
verify_jwt = true
