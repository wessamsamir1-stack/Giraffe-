plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.giraffe.app"

    // mobile_scanner (MLKit) بيتطلب compileSdk 36، وفلاتر افتراضيه 34.
    // من غير السطر ده البناء بيفشل برسالة عن اعتماد بيطلب نسخة أعلى.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.giraffe.app"

        // 23 = أندرويد 6 (2015). كان 21، بس androidx.camera:camera-core
        // اللي جاية مع mobile_scanner بتطلب 23 كحد أدنى، والبناء
        // بيقع في دمج الـ manifest من غيرها.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
