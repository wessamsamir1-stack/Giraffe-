pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// الإصدارات دي مش من قالب فلاتر — القالب كان AGP 8.1 و Kotlin 1.8.
//
// Kotlin 2.1: مكتبة mobile_scanner مبنية بيها، والمترجم 1.8 مابيقراش
//   ملفاتها خالص ("metadata version is 2.1.0").
// AGP 8.7: الإصدارات اللي قبل 8.2 بتقع مع compileSdk 35+، واحنا على
//   36 عشان نفس المكتبة. والـ Gradle 8.10.2 هو أقل واحد بيشغّل AGP 8.7.
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.2" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
