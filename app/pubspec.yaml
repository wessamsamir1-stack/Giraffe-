name: giraffe
description: "Giraffe — Swipe. Match. Trade. شبكة مقايضة اجتماعية"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.15.4

  # اختيار الصور من الكاميرا والمعرض
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.11
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# app_links بييجي مع supabase_flutter. من 6.4.0 بيقرا
# `flutter.compileSdkVersion` جوّه build.gradle بتاعه، والامتداد ده
# مش متاح للمكتبات في فلاتر 3.24 — فبناء أندرويد بيقع برسالة
# «compileSdkVersion is not specified».
#
# 6.3.x بيكتب الرقم صريح. شيل السطر ده لما فلاتر يتحدّث.
dependency_overrides:
  app_links: ">=6.3.0 <6.4.0"

flutter:
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # الخطوط — Fonts
  #
  # IBM Plex Sans Arabic بيغطّي العربي واللاتيني مع بعض، فخط واحد للغتين
  # بدل خطّين — وده اللي بيخلي الأرقام والأسعار جوّه جملة عربي ماشية
  # على نفس الوزن والارتفاع بدل ما تقفز.
  #
  # الرخصة: SIL Open Font License — assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
